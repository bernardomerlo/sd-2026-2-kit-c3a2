services:
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  # ---- Etapa 2: banco vetorial -------------------------------------------------
  qdrant:
    image: qdrant/qdrant:v1.12.4
    # Loopback apenas (dashboard em http://localhost:6333/dashboard); nao expor na internet.
    ports: ["127.0.0.1:6333:6333"]
    volumes: ["qdrant_data:/qdrant/storage"]
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && printf \"GET /readyz HTTP/1.0\\r\\n\\r\\n\" >&3 && head -n1 <&3 | grep -q 200'"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---- Etapa 2: servico de inferencia (modelo sklearn + busca vetorial + LLM) ---
  # Sobe sozinho com:  docker compose up --build qdrant inferencia
  inferencia:
    build: ./inferencia
    ports: ["127.0.0.1:8001:8001"]   # so para testes locais; em producao fica na rede interna
    environment:
      - VECTOR_DB_URL=${VECTOR_DB_URL:-http://qdrant:6333}
      - VECTOR_COLLECTION=${VECTOR_COLLECTION:-documentos_tecnicos}
      - VECTOR_DB_API_KEY=${VECTOR_DB_API_KEY:-}
      - SEED_ON_STARTUP=${SEED_ON_STARTUP:-true}
      - VECTOR_DB_STARTUP_TIMEOUT_SECONDS=${VECTOR_DB_STARTUP_TIMEOUT_SECONDS:-120}
      - EMBEDDING_DIM=${EMBEDDING_DIM:-1024}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_API_URL=${LLM_API_URL:-https://api.openai.com/v1/chat/completions}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o-mini}
      - LLM_TIMEOUT_SECONDS=${LLM_TIMEOUT_SECONDS:-20}
    # "started" (e nao "healthy") de proposito: o servico reconecta sozinho se o Qdrant demorar
    # e o healthcheck do Qdrant abaixo e so informativo. A Etapa 5 pode endurecer para service_healthy.
    depends_on:
      qdrant: {condition: service_started}

  worker:
    build: ./worker
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis: {condition: service_healthy}

  gateway:
    build: ./gateway
    ports: ["8000:8000"]
    environment:
      - URL_INFERENCIA=http://inferencia:8001
      - JWT_SEGREDO=${JWT_SEGREDO:-troque-este-segredo}
    depends_on: [inferencia]

# Observe: os servicos se referenciam pelo NOME (inferencia, redis),
# nunca por IP fixo. Isso e descoberta de servicos. (Aula 14)

volumes:
  qdrant_data:
