# Plataforma de IA como Servico - sobe tudo com UM comando:
#   cp .env.example .env
#   docker compose up --build
# Os servicos se encontram pelo NOME (redis, qdrant, inferencia), nunca por IP. (Aula 14)

services:
  # ---- Etapa 3: broker (fila + status dos jobs com TTL) -------------------------
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ---- Etapa 4: Jaeger (recebe os traces OTLP e mostra a UI) ---------------------
  # UI: http://localhost:16686  -> Service "gateway" -> Find Traces
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - MEMORY_MAX_TRACES=5000      # guarda poucos traces em memoria (sem disco, some ao reiniciar)
    ports: ["127.0.0.1:16686:16686"]   # so loopback: nao expor a UI na internet

  # ---- Etapa 2: banco vetorial ---------------------------------------------------
  qdrant:
    image: qdrant/qdrant:v1.12.4
    # Loopback apenas (dashboard em http://localhost:6333/dashboard); nao expor na internet.
    ports: ["127.0.0.1:6333:6333"]
    volumes: ["qdrant_data:/qdrant/storage"]
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && printf \"GET /readyz HTTP/1.0\\r\\n\\r\\n\" >&3 && head -n1 <&3 | grep -q 200'"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---- Etapa 2: servico de inferencia (modelo sklearn + busca vetorial + LLM) ---
  inferencia:
    build: ./inferencia
    ports: ["127.0.0.1:8001:8001"]   # so para testes locais; em producao fica na rede interna
    environment:
      - VECTOR_DB_URL=${VECTOR_DB_URL:-http://qdrant:6333}
      - VECTOR_COLLECTION=${VECTOR_COLLECTION:-documentos_tecnicos}
      - VECTOR_DB_API_KEY=${VECTOR_DB_API_KEY:-}
      - SEED_ON_STARTUP=${SEED_ON_STARTUP:-true}
      - VECTOR_DB_STARTUP_TIMEOUT_SECONDS=${VECTOR_DB_STARTUP_TIMEOUT_SECONDS:-120}
      - EMBEDDING_DIM=${EMBEDDING_DIM:-1024}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_API_URL=${LLM_API_URL:-https://api.openai.com/v1/chat/completions}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o-mini}
      - LLM_TIMEOUT_SECONDS=${LLM_TIMEOUT_SECONDS:-20}
    # "started" de proposito: o servico reconecta sozinho se o Qdrant demorar.
    depends_on:
      qdrant: {condition: service_started}

  # ---- Etapa 3: worker (consome a fila e chama a inferencia) ---------------------
  worker:
    build: ./worker
    environment:
      - BROKER_URL=redis://redis:6379/0
      - INFERENCE_URL=http://inferencia:8001
      - JOB_TTL_SECONDS=${JOB_TTL_SECONDS:-3600}
      - OTEL_SERVICE_NAME=worker
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT-http://jaeger:4318}
    stop_grace_period: 30s
    depends_on:
      redis: {condition: service_healthy}
      inferencia: {condition: service_healthy}

  # ---- Etapa 1: API Gateway (unica porta exposta) --------------------------------
  gateway:
    build: ./gateway
    ports: ["8000:8000"]
    env_file:
      - path: .env
        required: false   # funciona mesmo sem .env (usa os padroes)
    environment:
      - REDIS_URL=redis://redis:6379/0
      - INFERENCE_URL=http://inferencia:8001
      - JOB_TTL_SECONDS=${JOB_TTL_SECONDS:-3600}
      - OTEL_SERVICE_NAME=gateway
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT-http://jaeger:4318}
    depends_on:
      redis: {condition: service_healthy}
      inferencia: {condition: service_healthy}

volumes:
  qdrant_data:
