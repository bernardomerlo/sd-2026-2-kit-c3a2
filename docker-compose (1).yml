# Plataforma de IA como Servico - sobe TUDO com:  docker compose up --build -d
# Os servicos se encontram pelo NOME (redis, qdrant, inferencia...), nunca por IP.

services:

  # ---------- Fila de mensagens + status dos jobs (Etapa 3) ----------
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks: [plataforma]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---------- Armazenamento vetorial (Etapa 2) ----------
  qdrant:
    image: qdrant/qdrant:v1.12.4
    restart: unless-stopped
    networks: [plataforma]
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---------- Rastreamento distribuido (Etapa 4) ----------
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    restart: unless-stopped
    networks: [plataforma]
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686"   # painel web do Jaeger (http://localhost:16686)

  # ---------- Servico de inferencia (Etapa 2) ----------
  # Descomente quando a pasta inferencia/ (com Dockerfile) estiver no repositorio.
  # inferencia:
  #   build: ./inferencia
  #   restart: unless-stopped
  #   networks: [plataforma]
  #   env_file: .env
  #   environment:
  #     - VECTOR_DB_URL=http://qdrant:6333
  #     - OTEL_SERVICE_NAME=inferencia
  #   depends_on:
  #     qdrant: {condition: service_healthy}
  #   healthcheck:
  #     test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 12

  # ---------- Worker da fila (Etapa 3) ----------
  # Descomente quando a pasta worker/ (com Dockerfile) estiver no repositorio.
  # worker:
  #   build: ./worker
  #   restart: unless-stopped
  #   networks: [plataforma]
  #   env_file: .env
  #   environment:
  #     - REDIS_URL=redis://redis:6379/0
  #     - INFERENCE_URL=http://inferencia:8001
  #     - OTEL_SERVICE_NAME=worker
  #   depends_on:
  #     redis: {condition: service_healthy}
  #     inferencia: {condition: service_healthy}

  # ---------- API Gateway (Etapa 1) - unica porta exposta ----------
  gateway:
    build: ./gateway
    restart: unless-stopped
    networks: [plataforma]
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - INFERENCE_URL=http://inferencia:8001
      - OTEL_SERVICE_NAME=gateway
    ports:
      - "8000:8000"
    depends_on:
      redis: {condition: service_healthy}
      # inferencia: {condition: service_healthy}   # descomente junto com o inferencia
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 6

networks:
  plataforma:
    driver: bridge

volumes:
  qdrant_data:
